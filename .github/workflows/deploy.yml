
name: Manual Deployment by Git Tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git Tag to deploy (e.g. v20261126-2d69823)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Selected Version
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout selected Git Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate Git Tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]{8}-[0-9a-f]{7}$ ]]; then
            echo "ERROR: Invalid tag format."
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            echo "ERROR: Tag does not exist."
            exit 1
          fi

          echo "Deploying tag: $TAG"
          git log -1 --oneline "$TAG"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          mkdir -p site-dist

          sed "s/__VERSION__/${VERSION}/g" \
            part2/site/index.html > site-dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        env:
          TAG: ${{ inputs.tag }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "## Manual Deployment Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Selected Tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- Website: $URL" >> "$GITHUB_STEP_SUMMARY"
