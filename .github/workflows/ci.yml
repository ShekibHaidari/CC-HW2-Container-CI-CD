
name: Cloud Computing CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # 1. Code and Dockerfile quality checks
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: part2/Dockerfile
          failure-threshold: error

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint Python code
        run: ruff check part2/app/

  # 2. Run project tests
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: part2
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: part2
        run: pytest

  # 3. Build Docker image without publishing
  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          DATE=$(git show -s --format=%cs "$GITHUB_SHA" | tr -d '-')
          VERSION="v${DATE}-${GITHUB_SHA:0:7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./part2
          file: ./part2/Dockerfile
          push: false
          tags: ghcr.io/shekibhaidari/lab-queue:${{ steps.version.outputs.version }}

  # 4. Publish Docker image to GHCR
  push:
    name: Push
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./part2
          file: ./part2/Dockerfile
          push: true
          tags: |
            ghcr.io/shekibhaidari/lab-queue:${{ needs.build.outputs.version }}
            ghcr.io/shekibhaidari/lab-queue:latest

  # 5. Publish static website to GitHub Pages
  pages:
    name: Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p site-dist
          sed "s/__VERSION__/${VERSION}/g" \
            part2/site/index.html > site-dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 6. Create annotated Git tag
  tag:
    name: Tag
    needs: [build, push, pages]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create annotated tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin \
            "refs/tags/${VERSION}" >/dev/null 2>&1; then

            EXISTING_SHA=$(git ls-remote origin \
              "refs/tags/${VERSION}^{}" | awk '{print $1}')

            if [ -z "$EXISTING_SHA" ]; then
              EXISTING_SHA=$(git ls-remote origin \
                "refs/tags/${VERSION}" | awk '{print $1}')
            fi

            if [ "$EXISTING_SHA" != "$GITHUB_SHA" ]; then
              echo "ERROR: Tag already exists on another commit."
              exit 1
            fi

            echo "Tag already exists on the same commit."

          else
            git tag -a "$VERSION" "$GITHUB_SHA" \
              -m "Release $VERSION for commit $GITHUB_SHA"

            git push origin "refs/tags/${VERSION}"
          fi
