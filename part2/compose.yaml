
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-queue:local
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      DATA_DIR: /data
    volumes:
      - queue-data:/data
    restart: unless-stopped

volumes:
  queue-data:
